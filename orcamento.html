<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RSC Technology | Orçamento</title>
  <style>
     body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f9f9f9;
            color: #333;
        }

        h1 {
            text-align: center;
            color: #222;
        }

    form {
      background-color: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      margin: auto;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 10px;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
    }

    button {
      background-color: #4CAF50;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>

<h1>RSC TECHNOLOGY</h1>
<p style="text-align:center; font-weight:bold;">ORÇAMENTO - <span id="dataHoje"></span></p>

<form id="orcamentoForm">
  <label for="nome">Nome do Cliente:</label>
  <input type="text" id="nome" name="nome" required />

  <label for="telefone">Whatsapp com DDD:</label>
  <input type="tel" id="telefone" name="telefone" required placeholder="11912345678" />

  <label for="marca">Marca do Equipamento:</label>
  <input type="text" id="marca" name="marca" required />

  <label for="modelo">Modelo do Equipamento:</label>
  <input type="text" id="modelo" name="modelo" required />

  <label for="problema">Defeito Apresentado:</label>
  <textarea id="problema" name="problema" required></textarea>

  <label for="valor">Valor do Orçamento:</label>
  <input type="text" id="valor" name="valor" required placeholder="R$ 0,00" />

  <button type="submit">Enviar Orçamento</button>
</form>

<script>
  //Funcao para atualizar a data
  const hoje = new Date().toLocaleDateString();
  document.getElementById('dataHoje').textContent = hoje;
  
  // Formatação automática do campo VALOR como moeda BR
  const valorInput = document.getElementById("valor");
  valorInput.addEventListener("input", () => {
    let value = valorInput.value.replace(/\D/g, "");
    value = (parseInt(value || 0) / 100).toLocaleString("pt-BR", {
      style: "currency",
      currency: "BRL"
    });
    valorInput.value = value;
  });

  document.getElementById("orcamentoForm").addEventListener("submit", function (e) {
    e.preventDefault();

    const nome = document.getElementById("nome").value;
    const telefone = document.getElementById("telefone").value.replace(/\D/g, ""); // Apenas números
    const marca = document.getElementById("marca").value;
    const modelo = document.getElementById("modelo").value;
    const problema = document.getElementById("problema").value;
    const valor = document.getElementById("valor").value;

    const params = new URLSearchParams({
      nome,
      telefone,
      marca,
      modelo,
      problema,
      valor
    });

    const linkForm2 = `https://ambienteseguro.github.io/ordem-de-servico-cliente/form2.html?${params.toString()}`;
    const msg = `Olá, ${nome}!\n\nSegue seu orçamento no link abaixo:\n\n${linkForm2}\n\nQualquer dúvida estou à disposição!\n\nAtenciosamente,\n\nRafael - Técnico de Informática`;

    const linkWhatsApp = `https://wa.me/55${telefone}?text=${encodeURIComponent(msg)}`;

    window.open(linkWhatsApp, "_blank");
  });
</script>

</body>
</html>
